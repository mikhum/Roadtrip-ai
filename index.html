<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roadtrip AI</title>

    <!-- Ladda Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google API & Identity (För Google Drive) -->
    <script src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
    <script src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; margin: 0; padding: 0; overflow: hidden; touch-action: none;}
        .gmnoprint { transition: opacity 0.3s ease; }
        
        /* Enkel styling för att göra Google Maps-infofönstret snyggare */
        .gm-style-iw { padding: 0 !important; border-radius: 8px !important; }
        .gm-style-iw-d { overflow: hidden !important; }
        .gm-ui-hover-effect { top: 4px !important; right: 4px !important; background: white !important; border-radius: 50% !important; }
        
        /* Tillägg för att stylea Google Autocomplete dropdown */
        .pac-container { z-index: 9999 !important; border-radius: 0.5rem; border: 1px solid #e2e8f0; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); font-family: 'Inter', sans-serif; margin-top: 4px;}
        .pac-item { padding: 8px 12px; cursor: pointer; }
        .pac-item:hover { background-color: #f8fafc; }
    </style>
</head>
<body class="h-[100dvh] flex flex-col relative">

    <!-- Inställnings-modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-md m-4 relative">
            <button onclick="toggleSettings()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                Inställningar
            </h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Google API-nyckel (Maps & Gemini)</label>
                    <input type="password" id="apiKey" placeholder="AIzaSy..." class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <p class="text-xs text-gray-500 mt-1">Används för kartan, platssökning och Gemini AI.</p>
                </div>
                
                <!-- Google Drive Sektion -->
                <div class="pt-3 border-t border-gray-100">
                    <h3 class="text-xs font-bold text-gray-700 mb-2 uppercase tracking-wide">Google Drive Synk</h3>
                    <div class="flex gap-2">
                        <button id="loadDriveBtn" disabled onclick="loadKeyFromDrive()" class="flex-1 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 text-xs font-medium py-2 rounded-lg transition-colors flex items-center justify-center gap-1.5 opacity-50 cursor-not-allowed">
                            <svg class="w-4 h-4 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            Hämta
                        </button>
                        <button id="saveDriveBtn" disabled onclick="saveKeyToDrive()" class="flex-1 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 text-xs font-medium py-2 rounded-lg transition-colors flex items-center justify-center gap-1.5 opacity-50 cursor-not-allowed">
                            <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                            Spara
                        </button>
                    </div>
                    <p id="driveStatus" class="text-[10px] mt-1.5 text-center text-gray-500 min-h-[15px]"></p>
                </div>

                <button onclick="saveKeyAndStart()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition-colors">
                    Spara & Starta Kartan
                </button>
            </div>
        </div>
    </div>

    <!-- HUVUD-HEADER -->
    <header class="bg-white shadow-sm z-20 px-4 py-3 border-b border-gray-200 shrink-0 w-full flex flex-col md:flex-row md:items-center justify-between gap-3">
        
        <div class="flex items-center justify-between md:justify-start w-full md:w-auto gap-4">
            <div class="flex items-center gap-2">
                <div class="bg-indigo-600 p-1.5 rounded-lg text-white">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <h1 class="text-lg font-bold text-gray-800 tracking-tight whitespace-nowrap">Roadtrip AI</h1>
            </div>
            
            <button onclick="toggleSettings()" class="md:hidden p-2 text-gray-500 hover:bg-gray-100 rounded-full transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
        </div>

        <!-- Sökkontroller -->
        <div class="flex-1 flex flex-col sm:flex-row items-center gap-3 w-full md:max-w-4xl">
            
            <!-- Nytt fält för att förflytta kartan -->
            <div class="relative w-full sm:w-48 shrink-0">
                <input type="text" id="locationSearch" placeholder="Gå till ort..." class="w-full pl-8 pr-3 py-1.5 text-sm border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-gray-50">
                <svg class="w-4 h-4 text-gray-400 absolute left-2.5 top-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </div>

            <!-- Gemini sökfält -->
            <div class="relative flex-1 w-full flex items-center">
                <input type="text" id="freeText" placeholder="Fråga Gemini Pro (t.ex. 'Hotell med pool')..." class="w-full pl-8 pr-10 py-1.5 text-sm border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:outline-none" onkeypress="if(event.key === 'Enter') triggerAiSearch()">
                <svg class="w-4 h-4 text-gray-400 absolute left-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                
                <button id="micBtn" onclick="toggleVoiceInput()" class="absolute right-2 text-gray-400 hover:text-indigo-600 p-1 transition-colors" title="Tala in din fråga">
                    <svg id="micIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                </button>
            </div>
            
            <button onclick="triggerAiSearch()" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-1.5 rounded-md text-sm transition-colors shrink-0 flex items-center justify-center gap-1">
                <span>Fråga Gemini</span>
            </button>
            
            <!-- Betyg (Dynamisk filtrering) -->
            <div class="flex items-center gap-2 w-full sm:w-auto sm:border-l sm:border-gray-300 sm:pl-3 shrink-0 justify-between sm:justify-start">
                <label class="text-[10px] sm:text-xs font-bold text-gray-500 uppercase tracking-wide whitespace-nowrap">Minst: <span id="ratingVal" class="text-indigo-600">1.0</span>⭐</label>
                <input type="range" id="minRating" min="1" max="5" step="0.5" value="1.0" class="w-24 sm:w-28 accent-indigo-600 h-1.5">
            </div>
        </div>
        
        <button onclick="toggleSettings()" class="hidden md:block p-2 text-gray-500 hover:bg-gray-100 rounded-full transition-colors shrink-0">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </button>
    </header>

    <!-- INNEHÅLL (Endast Karta) -->
    <main class="flex-1 flex flex-col md:flex-row relative overflow-hidden">
        
        <div class="flex-1 relative bg-gray-200 w-full">
            <div id="map" class="absolute inset-0"></div>
            
            <div id="mapOverlay" class="absolute inset-0 bg-white/90 backdrop-blur-sm flex flex-col items-center justify-center z-10 hidden">
                <p class="text-indigo-600 font-bold animate-pulse" id="overlayText">Laddar modern karta...</p>
            </div>

            <!-- Toast Messages (höjd z-index för att synas överallt) -->
            <div id="statusMessage" class="hidden absolute top-20 left-1/2 transform -translate-x-1/2 z-[60] px-4 py-2 rounded shadow-md text-xs sm:text-sm font-medium text-center whitespace-nowrap transition-all"></div>

            <div id="drawBtn" class="absolute top-4 left-1/2 transform -translate-x-1/2 z-10 hidden">
                <button onclick="activateDrawMode()" class="bg-white hover:bg-indigo-50 border border-indigo-500 text-indigo-700 font-bold text-xs sm:text-sm px-4 py-2 rounded-full shadow-md flex items-center gap-1.5 transition-all active:scale-95 whitespace-nowrap">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                    Rita område
                </button>
            </div>

            <div id="drawingToast" class="absolute top-4 left-1/2 transform -translate-x-1/2 z-10 hidden pointer-events-none">
                <div class="bg-indigo-600 text-white font-bold text-xs px-4 py-2 rounded-full shadow-md flex items-center gap-2 animate-pulse whitespace-nowrap">
                    Rita på skärmen...
                </div>
            </div>

            <button onclick="geolocateUser()" class="absolute bottom-6 right-3 z-10 bg-white p-2.5 rounded-full shadow border border-gray-200 text-gray-600 hover:text-indigo-600 hover:bg-gray-50 transition-colors" title="Min position">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"></path></svg>
            </button>
        </div>
    </main>

    <script>
        let map;
        let currentPolygon = null;
        let placeMarkers = [];
        let infoWindow;
        let allFetchedPlaces = [];

        let isDrawMode = false;
        let freehandPath = [];
        let freehandLine = null;
        let drawListeners = [];

        const CLIENT_ID = '940508107225-2h91m1o4he6r27g1q7hgtaq0f6127dd8.apps.googleusercontent.com';
        const DISCOVERY_DOC = 'https://www.googleapis.com/discovery/v1/apis/drive/v3/rest';
        const SCOPES = 'https://www.googleapis.com/auth/drive.appdata';
        const FILE_NAME = 'roadtrip_config.json';
        
        let tokenClient;
        let gapiInited = false;
        let gisInited = false;
        let recognition = null;

        function gapiLoaded() {
            gapi.load('client', async () => {
                try {
                    await gapi.client.init({ discoveryDocs: [DISCOVERY_DOC] });
                    gapiInited = true;
                    enableDriveButtons();
                } catch(e) { console.error('GAPI init error:', e); }
            });
        }

        function gisLoaded() {
            try {
                tokenClient = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: SCOPES, callback: '' });
                gisInited = true;
                enableDriveButtons();
            } catch(e) { console.error('GIS init error:', e); }
        }

        function enableDriveButtons() {
            if(gapiInited && gisInited && document.getElementById('loadDriveBtn')) {
                document.getElementById('loadDriveBtn').classList.remove('opacity-50', 'cursor-not-allowed');
                document.getElementById('saveDriveBtn').classList.remove('opacity-50', 'cursor-not-allowed');
                document.getElementById('loadDriveBtn').disabled = false;
                document.getElementById('saveDriveBtn').disabled = false;
            }
        }

        async function getAuthToken() {
            return new Promise((resolve, reject) => {
                if (gapi.client.getToken() !== null) resolve();
                else {
                    tokenClient.callback = (resp) => { if (resp.error !== undefined) reject(resp); else resolve(); };
                    tokenClient.requestAccessToken({ prompt: 'consent' });
                }
            });
        }

        function setDriveStatus(msg, type) {
            const el = document.getElementById('driveStatus');
            if(!el) return;
            el.innerText = msg;
            if(type==='error') el.className = 'text-[10px] mt-1.5 text-center text-red-600 font-bold min-h-[15px]';
            else if(type==='success') el.className = 'text-[10px] mt-1.5 text-center text-green-600 font-bold min-h-[15px]';
            else if(type==='warning') el.className = 'text-[10px] mt-1.5 text-center text-amber-600 font-bold min-h-[15px]';
            else el.className = 'text-[10px] mt-1.5 text-center text-blue-600 font-bold min-h-[15px]';
        }

        async function loadKeyFromDrive() {
            try {
                setDriveStatus('Väntar på inloggning...', 'info');
                await getAuthToken();
                setDriveStatus('Söker efter nyckel på Drive...', 'info');
                
                const response = await gapi.client.drive.files.list({ spaces: 'appDataFolder', q: `name='${FILE_NAME}'`, fields: 'files(id, name)' });
                const files = response.result.files;

                if (files && files.length > 0) {
                    const fileRes = await gapi.client.drive.files.get({ fileId: files[0].id, alt: 'media' });
                    if (fileRes.result && fileRes.result.apiKey) {
                        document.getElementById('apiKey').value = fileRes.result.apiKey;
                        setDriveStatus('Nyckel hämtad!', 'success');
                    } else { setDriveStatus('Filen saknade API-nyckel.', 'warning'); }
                } else { setDriveStatus('Ingen sparad nyckel hittades.', 'warning'); }
            } catch (err) { setDriveStatus('Ett fel uppstod.', 'error'); }
        }

        async function saveKeyToDrive() {
            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) return setDriveStatus('Ange en nyckel i fältet först.', 'warning');

            try {
                setDriveStatus('Väntar på inloggning...', 'info');
                await getAuthToken();
                setDriveStatus('Förbereder att spara...', 'info');
                
                const response = await gapi.client.drive.files.list({ spaces: 'appDataFolder', q: `name='${FILE_NAME}'`, fields: 'files(id, name)' });
                const files = response.result.files;
                
                const fileContent = JSON.stringify({ apiKey: apiKey });
                const fileMetadata = { name: FILE_NAME, parents: ['appDataFolder'] };
                const boundary = '-------314159265358979323846';
                const delimiter = "\r\n--" + boundary + "\r\n";
                const close_delim = "\r\n--" + boundary + "--";

                let multipartRequestBody = delimiter + 'Content-Type: application/json\r\n\r\n' + JSON.stringify(fileMetadata) + delimiter + 'Content-Type: application/json\r\n\r\n' + fileContent + close_delim;

                let request = gapi.client.request({
                    'path': files && files.length > 0 ? '/upload/drive/v3/files/' + files[0].id : '/upload/drive/v3/files',
                    'method': files && files.length > 0 ? 'PATCH' : 'POST',
                    'params': {'uploadType': 'multipart'},
                    'headers': {'Content-Type': 'multipart/related; boundary="' + boundary + '"'},
                    'body': multipartRequestBody
                });

                request.execute(function(file) {
                    if(file.error) setDriveStatus('Kunde inte spara till Drive.', 'error');
                    else setDriveStatus('Nyckel sparad i molnet!', 'success');
                });
            } catch (err) { setDriveStatus('Ett fel uppstod.', 'error'); }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('googleMapsApiKey');
            if (savedKey) {
                document.getElementById('apiKey').value = savedKey;
                toggleSettings(false); 
                initApp();
            } else {
                toggleSettings(true); 
            }
        });

        function toggleSettings(forceShow = null) {
            const modal = document.getElementById('settingsModal');
            if (forceShow === true) modal.classList.remove('hidden');
            else if (forceShow === false) modal.classList.add('hidden');
            else modal.classList.toggle('hidden');
        }

        function saveKeyAndStart() {
            const apiKey = document.getElementById('apiKey').value.trim();
            if (apiKey) {
                localStorage.setItem('googleMapsApiKey', apiKey);
                toggleSettings(false);
                initApp();
            } else { 
                setDriveStatus("Ange en API-nyckel först.", "warning"); 
            }
        }

        function setStatus(msg, type = 'info') {
            const statusDiv = document.getElementById('statusMessage');
            if(!msg) {
                statusDiv.classList.add('hidden');
                return;
            }
            statusDiv.className = 'absolute top-20 left-1/2 transform -translate-x-1/2 z-[60] px-4 py-2 rounded shadow-md text-xs sm:text-sm font-medium text-center whitespace-nowrap transition-all';
            
            if (type === 'error') statusDiv.classList.add('bg-red-100', 'text-red-800', 'border', 'border-red-200');
            else if (type === 'info') statusDiv.classList.add('bg-blue-100', 'text-blue-800', 'border', 'border-blue-200');
            else if (type === 'warning') statusDiv.classList.add('bg-yellow-100', 'text-yellow-800', 'border', 'border-yellow-200');
            else if (type === 'success') statusDiv.classList.add('bg-green-100', 'text-green-800', 'border', 'border-green-200');
            
            statusDiv.innerText = msg;
            statusDiv.classList.remove('hidden');
            
            if(type === 'success' || type === 'warning' || type === 'error') {
                setTimeout(() => statusDiv.classList.add('hidden'), 3500);
            }
        }

        function initApp() {
            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) return;

            document.getElementById('mapOverlay').classList.remove('hidden');
            document.getElementById('overlayText').innerText = 'Laddar modern karta...';

            if (window.google && window.google.maps) {
                window.initializeMap();
                return;
            }

            const script = document.createElement('script');
            script.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&v=3.64&libraries=geometry,places&callback=initializeMap&loading=async`;
            script.async = true;
            script.defer = true;
            script.onerror = () => {
                document.getElementById('overlayText').className = 'text-red-500 font-bold';
                document.getElementById('overlayText').innerText = 'Kunde inte ladda Google Maps.';
            };
            document.head.appendChild(script);
        }

        window.initializeMap = function() {
            document.getElementById('mapOverlay').classList.add('hidden');
            document.getElementById('drawBtn').style.display = 'block';

            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: 59.3293, lng: 18.0686 },
                zoom: 12,
                mapTypeControl: false,
                streetViewControl: false,
                gestureHandling: 'greedy', 
                styles: [{ featureType: "poi", elementType: "labels", stylers: [{ visibility: "off" }] }]
            });

            infoWindow = new google.maps.InfoWindow();

            const locationInput = document.getElementById('locationSearch');
            const autocomplete = new google.maps.places.Autocomplete(locationInput);
            autocomplete.bindTo('bounds', map);

            autocomplete.addListener('place_changed', () => {
                const place = autocomplete.getPlace();
                if (!place.geometry || !place.geometry.location) {
                    setStatus('Kunde inte hitta platsen på kartan.', 'warning');
                    return;
                }

                if (place.geometry.viewport) {
                    map.fitBounds(place.geometry.viewport);
                } else {
                    map.setCenter(place.geometry.location);
                    map.setZoom(13);
                }
                locationInput.blur();
            });
        };

        function geolocateUser() {
            if (!map) return;
            if (navigator.geolocation) {
                setStatus('Söker position...', 'info');
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const pos = { lat: position.coords.latitude, lng: position.coords.longitude };
                        map.panTo(pos);
                        map.setZoom(14);
                        setStatus(null);
                        new google.maps.Marker({
                            position: pos, map: map,
                            icon: { path: google.maps.SymbolPath.CIRCLE, scale: 7, fillColor: '#3b82f6', fillOpacity: 1, strokeColor: 'white', strokeWeight: 2 },
                            title: 'Din position', zIndex: 9999
                        });
                    },
                    () => { setStatus('Kunde inte hämta position.', 'error'); }
                );
            }
        }

        function activateDrawMode() {
            if (isDrawMode || !map) return;
            isDrawMode = true;

            document.getElementById('drawBtn').style.display = 'none';
            document.getElementById('drawingToast').style.display = 'block';
            map.setOptions({ draggable: false, gestureHandling: 'none', draggableCursor: 'crosshair' });

            freehandPath = [];
            if (freehandLine) { freehandLine.setMap(null); freehandLine = null; }
            if (currentPolygon) { currentPolygon.setMap(null); currentPolygon = null; }

            const mapDiv = document.getElementById('map');
            let isDrawingActive = false;

            function getLatLngFromEvent(e) {
                const rect = mapDiv.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const point = new google.maps.Point(clientX - rect.left, clientY - rect.top);
                const proj = map.getProjection();
                const bounds = map.getBounds();
                const ne = bounds.getNorthEast();
                const sw = bounds.getSouthWest();
                const scale = Math.pow(2, map.getZoom());
                const worldPoint = new google.maps.Point(
                    (point.x / scale) + proj.fromLatLngToPoint(new google.maps.LatLng(ne.lat(), sw.lng())).x,
                    (point.y / scale) + proj.fromLatLngToPoint(new google.maps.LatLng(ne.lat(), sw.lng())).y
                );
                return proj.fromPointToLatLng(worldPoint);
            }

            function startDraw(e) {
                if(e.target.closest('#map')) e.preventDefault(); 
                isDrawingActive = true;
                freehandPath = [getLatLngFromEvent(e)];
            }

            function moveDraw(e) {
                if (!isDrawingActive) return;
                if(e.target.closest('#map')) e.preventDefault();
                freehandPath.push(getLatLngFromEvent(e));
                
                if (freehandLine) freehandLine.setPath(freehandPath);
                else {
                    freehandLine = new google.maps.Polyline({
                        path: freehandPath, strokeColor: '#4f46e5', strokeWeight: 2.5, strokeOpacity: 0.8, map: map
                    });
                }
            }

            function endDraw() {
                if (!isDrawingActive) return;
                isDrawingActive = false;
                isDrawMode = false;
                
                drawListeners.forEach(listener => mapDiv.removeEventListener(listener.type, listener.fn));
                drawListeners = [];

                map.setOptions({ draggable: true, gestureHandling: 'greedy', draggableCursor: '' });
                if (freehandLine) { freehandLine.setMap(null); freehandLine = null; }

                document.getElementById('drawingToast').style.display = 'none';
                document.getElementById('drawBtn').style.display = 'block';

                if (freehandPath.length < 3) return;

                currentPolygon = new google.maps.Polygon({
                    paths: freehandPath, fillColor: '#4f46e5', fillOpacity: 0.15, strokeWeight: 2, strokeColor: '#4f46e5', map: map
                });

                triggerAiSearch();
            }

            const events = [
                { type: 'mousedown', fn: startDraw }, { type: 'touchstart', fn: startDraw },
                { type: 'mousemove', fn: moveDraw }, { type: 'touchmove', fn: moveDraw },
                { type: 'mouseup', fn: endDraw }, { type: 'touchend', fn: endDraw },
                { type: 'mouseleave', fn: endDraw }
            ];

            events.forEach(event => {
                mapDiv.addEventListener(event.type, event.fn, { passive: false });
                drawListeners.push(event);
            });
        }

        function toggleVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                setStatus("Röststyrning stöds inte i din webbläsare.", "error");
                return;
            }

            if (recognition && recognition.recording) { recognition.stop(); return; }

            recognition = new SpeechRecognition();
            recognition.lang = 'sv-SE';
            recognition.interimResults = false;

            const micIcon = document.getElementById('micIcon');

            recognition.onstart = () => { 
                recognition.recording = true;
                micIcon.classList.add('text-red-500', 'animate-pulse');
                setStatus('Lyssnar...', 'info');
            };
            
            recognition.onresult = (event) => {
                document.getElementById('freeText').value = event.results[0][0].transcript;
                triggerAiSearch();
            };

            recognition.onerror = () => { setStatus('Kunde inte uppfatta rösten.', 'error'); };

            recognition.onend = () => {
                recognition.recording = false;
                micIcon.classList.remove('text-red-500', 'animate-pulse');
            };

            recognition.start();
        }

        async function triggerAiSearch() {
            if (!currentPolygon) return setStatus('Rita ett område på kartan först!', 'warning');
            
            const promptText = document.getElementById('freeText').value.trim();
            if (!promptText) return setStatus('Skriv eller tala in vad du söker efter.', 'warning');

            clearResults();
            setStatus('Gemini tolkar din fråga...', 'info');

            const apiKey = document.getElementById('apiKey').value.trim();
            
            try {
                const geminiRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-pro:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `Du är en assistent som konverterar användarens sökönskemål till en optimerad sökfras för Google Places API Text Search. 
                                Sökönskemål: "${promptText}". 
                                Svara ENDAST med ett giltigt JSON-objekt i formatet: {"searchQuery": "din engelska eller svenska sökfras"}`
                            }]
                        }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                if (!geminiRes.ok) throw new Error('Gemini API svarade inte.');
                
                const geminiData = await geminiRes.json();
                const parsed = JSON.parse(geminiData.candidates[0].content.parts[0].text);
                
                performSearchInPolygon(currentPolygon, parsed.searchQuery || promptText);
            } catch (err) {
                setStatus('Kunde inte tolka med Gemini, söker direkt på din text...', 'warning');
                performSearchInPolygon(currentPolygon, promptText);
            }
        }

        async function performSearchInPolygon(polygon, queryStr) {
            setStatus(`Söker efter: "${queryStr}"...`, 'info');
            const apiKey = document.getElementById('apiKey').value.trim();

            const polygonPath = polygon.getPath();
            let north = -90, south = 90, east = -180, west = 180;
            for (let i = 0; i < polygonPath.getLength(); i++) {
                const pt = polygonPath.getAt(i);
                if (pt.lat() > north) north = pt.lat();
                if (pt.lat() < south) south = pt.lat();
                if (pt.lng() > east) east = pt.lng();
                if (pt.lng() < west) west = pt.lng();
            }

            // STATISK FIELD MASKING (Kostnadsoptimering - EV borttaget helt för att spara pengar)
            let fieldMask = 'places.id,places.displayName,places.location,places.rating,places.priceLevel,places.formattedAddress,places.photos,places.primaryType,places.googleMapsUri';

            try {
                const response = await fetch('https://places.googleapis.com/v1/places:searchText', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Goog-Api-Key': apiKey,
                        'X-Goog-FieldMask': fieldMask
                    },
                    body: JSON.stringify({
                        textQuery: queryStr,
                        locationRestriction: { rectangle: { low: { latitude: south, longitude: west }, high: { latitude: north, longitude: east } } }
                    })
                });

                if (!response.ok) throw new Error('Kunde inte hämta data');

                const data = await response.json();
                
                allFetchedPlaces = data.places || []; 
                applyRatingFilter();

            } catch (error) { setStatus('Ett fel uppstod vid sökning.', 'error'); }
        }

        function applyRatingFilter() {
            placeMarkers.forEach(hm => hm.marker.setMap(null));
            placeMarkers = [];
            infoWindow.close();

            if (!allFetchedPlaces || allFetchedPlaces.length === 0) {
                setStatus('Inga platser matchade sökningen.', 'warning');
                return;
            }

            const minRating = parseFloat(document.getElementById('minRating').value);
            const apiKey = document.getElementById('apiKey').value.trim();

            let filtered = allFetchedPlaces.filter(place => {
                if(!place.location) return false;
                const latLng = new google.maps.LatLng(place.location.latitude, place.location.longitude);
                return google.maps.geometry.poly.containsLocation(latLng, currentPolygon);
            });

            filtered = filtered.filter(place => (place.rating || 0) >= minRating);

            if (filtered.length === 0) {
                setStatus(`Inga platser klarade betygsgränsen (${minRating}⭐).`, 'warning');
                return;
            }

            setStatus(`Hittade ${filtered.length} st platser`, 'success');

            filtered.forEach(place => {
                const location = { lat: place.location.latitude, lng: place.location.longitude };
                
                const marker = new google.maps.Marker({
                    map: map, 
                    position: location, 
                    title: place.displayName.text,
                    label: { 
                        text: place.displayName.text, 
                        color: "#1e1b4b",
                        fontSize: "12px", 
                        fontWeight: "800" 
                    },
                    icon: { 
                        path: google.maps.SymbolPath.CIRCLE, 
                        scale: 6, 
                        fillColor: "#4f46e5", 
                        fillOpacity: 1, 
                        strokeColor: "white", 
                        strokeWeight: 2,
                        labelOrigin: new google.maps.Point(0, 2.5) 
                    }
                });

                placeMarkers.push({ id: place.id, marker: marker, data: place });

                marker.addListener('click', () => {
                    let photoUrl = 'https://placehold.co/300x150/f8fafc/94a3b8?text=Bild+saknas';
                    if (place.photos && place.photos.length > 0) {
                        photoUrl = `https://places.googleapis.com/v1/${place.photos[0].name}/media?key=${apiKey}&maxHeightPx=150&maxWidthPx=300`;
                    }

                    let typeStr = (place.primaryType || '').replace(/_/g, ' ');
                    typeStr = typeStr.charAt(0).toUpperCase() + typeStr.slice(1);

                    const priceLevels = { 'PRICE_LEVEL_INEXPENSIVE': '💰', 'PRICE_LEVEL_MODERATE': '💰💰', 'PRICE_LEVEL_EXPENSIVE': '💰💰💰', 'PRICE_LEVEL_VERY_EXPENSIVE': '💰💰💰💰' };
                    const priceBadge = place.priceLevel && priceLevels[place.priceLevel] ? priceLevels[place.priceLevel] : '';
                    
                    const safeUrl = place.googleMapsUri ? place.googleMapsUri : '#';
                    
                    const contentString = `
                        <div onclick="window.open('${safeUrl}', '_top')" style="max-width: 240px; font-family: 'Inter', sans-serif; cursor: pointer;">
                            <img src="${photoUrl}" style="width: 100%; height: 130px; object-fit: cover; margin-bottom: 12px; border-radius: 8px 8px 0 0;">
                            <div style="padding: 0 12px 12px 12px;">
                                <h3 style="margin: 0 0 6px 0; font-size: 15px; color: #111827;">${place.displayName.text}</h3>
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; color: #4b5563;">
                                    <span style="font-weight: 600;"><span style="color: #fbbf24; font-size: 15px;">★</span> ${place.rating || 'Nytt'}</span>
                                    <div style="display: flex; gap: 6px; align-items: center;">
                                        <span>${priceBadge}</span>
                                    </div>
                                </div>
                                <p style="margin: 0 0 4px 0; font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px;">${typeStr}</p>
                                <p style="margin: 0 0 8px 0; font-size: 12px; color: #6b7280; line-height: 1.4;">${place.formattedAddress}</p>
                                ${place.googleMapsUri ? `<button style="width:100%; display:block; text-align:center; margin-top:12px; padding:8px; background:#4f46e5; color:white; border:none; border-radius:6px; font-weight:bold; font-size:13px; cursor:pointer;">Öppna i Google Maps</button>` : ''}
                            </div>
                        </div>
                    `;

                    infoWindow.setContent(contentString);
                    infoWindow.open(map, marker);
                });
            });
        }

        function clearResults() {
            placeMarkers.forEach(hm => hm.marker.setMap(null));
            placeMarkers = [];
            allFetchedPlaces = [];
            infoWindow.close();
        }

        document.getElementById('minRating').addEventListener('input', (e) => {
            document.getElementById('ratingVal').innerText = e.target.value;
            if (currentPolygon && allFetchedPlaces.length > 0) applyRatingFilter();
        });
    </script>
